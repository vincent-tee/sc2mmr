[mypy]
# Ignore pre-existing SQLAlchemy type annotation issues
# These are NOT runtime errors - code executes correctly
# These are static type checker warnings only

python_version = 3.10

[[tool.mypy.overrides]]
# Ignore all type errors in backend/ (pre-existing SQLAlchemy issues)
"backend/.*".ignore_errors = true

[[tool.mypy.plugins]]
pydantic_mypy

[mypy plugins]
pydantic.mypy

[[tool.mypy]]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
