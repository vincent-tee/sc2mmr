[mypy]
# Ignore pre-existing SQLAlchemy type annotation issues
# These are NOT runtime errors - code executes correctly
# These are static type checker warnings only

python_version = 3.10
plugins = pydantic.mypy

[mypy-backend.*]
ignore_errors = True

[mypy-sc2reader.*]
ignore_missing_imports = True

[mypy-ability_discovery.*]
ignore_missing_imports = True

[mypy-app.*]
ignore_missing_imports = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
warn_untyped_fields = True
